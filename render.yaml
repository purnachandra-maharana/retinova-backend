services:
  - type: web
    name: retinova-backend
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://retinova-frontend.onrender.com,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: retinova-postgres
          property: connectionString

databases:
  - name: retinova-postgres
    plan: free
    region: oregon
    databaseName: retinova_db
    user: retinova_user
